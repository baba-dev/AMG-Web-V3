name: Homepage fidelity and cinematic player

on:
  pull_request:
    branches: [main]
    paths:
      - src/components/aiwa-hero.*
      - src/components/aiwa-polish.css
      - src/components/aiwa-film-player.*
      - src/components/aiwa-specialisms.*
      - src/components/aiwa-about.*
      - src/components/aiwa-work.*
      - src/components/aiwa-contact.*
      - src/components/aiwa-office.*
      - src/components/aiwa-footer.*
      - src/app/layout.tsx
      - scripts/homepage-fidelity-player.cjs
      - scripts/homepage-design-audit.cjs
      - .github/workflows/homepage-fidelity-player.yml
  push:
    branches: [fix/homepage-fidelity-video-mobile-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fidelity-player:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Static Next.js 26 build
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f out/index.html
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium --only-shell
      - name: Capture Aiwa homepage and cinematic video interaction frames
        run: |
          python3 -m http.server 4173 --directory out >/tmp/aiwa-fidelity-http.log 2>&1 &
          node scripts/homepage-fidelity-player.cjs
      - name: Audit responsive typography, spacing and accessibility targets
        run: node scripts/homepage-design-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aiwa-homepage-fidelity-cinema
          path: |
            test-artifacts/homepage-fidelity/
            test-artifacts/design-audit/
          retention-days: 7
