name: Hero browser visual smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Build static site
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f out/index.html
      - name: Install temporary browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium --only-shell
      - name: Start static preview and test desktop/mobile
        run: |
          python3 -m http.server 4173 --directory out > /tmp/aiwa-preview-http.log 2>&1 &
          node scripts/hero-visual-smoke.cjs
          node scripts/home-2-visual-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-visual-checks
          path: test-artifacts/
          retention-days: 7
