name: Work V3 editorial gallery and project routes

on:
  pull_request:
    branches: [main]
    paths:
      - src/app/work/**
      - src/components/aiwa-inner-header.*
      - src/components/aiwa-footer.*
      - src/components/aiwa-work.*
      - src/components/work-hero.*
      - src/components/work-gallery.*
      - src/components/work-process.*
      - src/lib/site-navigation.ts
      - src/lib/work/**
      - scripts/work-directory-qa.cjs
      - scripts/work-static-preview.cjs
      - .github/workflows/work-directory-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  work-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Build Cloudflare Pages static export
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f out/index.html
          test -f out/work.html || test -f out/work/index.html
          for slug in mymo-express casabella-oman best-genetco aqua-petro razmazaan vitamin-phones; do
            test -f "out/work/$slug.html" || test -f "out/work/$slug/index.html"
          done
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium --only-shell
      - name: Responsive, filter, navigation and project route regression
        run: |
          node scripts/work-static-preview.cjs > /tmp/aiwa-work-preview.log 2>&1 &
          node scripts/work-directory-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aiwa-work-v3-responsive-audit
          path: test-artifacts/work-directory/
          retention-days: 7
