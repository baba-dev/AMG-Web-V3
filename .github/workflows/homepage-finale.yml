name: Global SAY HELLO and footer

on:
  pull_request:
    branches: [main]
    paths:
      - src/components/aiwa-contact.*
      - src/components/aiwa-office.*
      - src/components/aiwa-footer.*
      - src/components/aiwa-hero.tsx
      - src/components/aiwa-global-ending.*
      - src/app/layout.tsx
      - src/app/privacy/**
      - src/app/terms/**
      - src/app/legal.css
      - public/media/finale/**
      - scripts/homepage-finale-smoke.cjs
      - .github/workflows/homepage-finale.yml
  push:
    branches:
      - feat/homepage-finale-contact-muscat-footer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finale:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Build Next.js static export
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f out/index.html
          test -f out/privacy.html
          test -f out/terms.html
          test -f out/work.html -o -f out/work/index.html
      - name: Install headless Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium --only-shell
      - name: Test single global ending, gallery, footer and no JS
        run: |
          node scripts/work-static-preview.cjs > /tmp/aiwa-finale-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/homepage-finale-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aiwa-homepage-finale-qa
          path: test-artifacts/finale/
          retention-days: 7
