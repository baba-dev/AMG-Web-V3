name: P2-C Specialisms — directory, seven services and inherited regressions

on:
  push:
    branches: [feat/specialisms-p2c-editorial-pages]
  pull_request:
    branches: [main]
    paths:
      - 'src/app/specialisms/**'
      - 'src/lib/specialisms.ts'
      - 'src/components/aiwa-specialisms.*'
      - 'src/components/aiwa-inner-header.*'
      - 'src/lib/site-navigation.ts'
      - 'public/media/specialisms/**'
      - 'scripts/specialisms-p2c-qa.cjs'
      - '.github/workflows/specialisms-p2c.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specialisms-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cloudflare Pages static export
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f out/index.html
          test -f out/specialisms.html || test -f out/specialisms/index.html
          for slug in global consumer corporate sports social studio tech; do
            test -f "out/specialisms/$slug.html" || test -f "out/specialisms/$slug/index.html"
          done
          for slug in mymo-express casabella-oman best-genetco aqua-petro razmazaan vitamin-phones; do
            test -f "out/work/$slug.html" || test -f "out/work/$slug/index.html"
          done
      - name: Headless Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium --only-shell
      - name: Eight routes, eight widths, source links, theme and no-JS
        run: |
          node scripts/work-static-preview.cjs >/tmp/aiwa-spec-preview.log 2>&1 &
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsS -o /dev/null http://127.0.0.1:4173/specialisms && break || sleep 1
          done
          node scripts/specialisms-p2c-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aiwa-specialisms-p2c-responsive
          path: test-artifacts/specialisms-p2c/
          retention-days: 7

  inherited-homepage-work-and-case-studies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Build existing homepage and Work
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium --only-shell
      - name: Homepage, Work and case-study regressions
        run: |
          node scripts/work-static-preview.cjs >/tmp/aiwa-spec-regressions.log 2>&1 &
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsS -o /dev/null http://127.0.0.1:4173/ && break || sleep 1
          done
          node scripts/homepage-design-audit.cjs
          node scripts/work-directory-qa.cjs
          node scripts/work-case-study-qa.cjs
          node scripts/work-section-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aiwa-p2c-inherited-regressions
          path: |
            test-artifacts/design-audit/
            test-artifacts/work-directory/
            test-artifacts/work-case-studies/
            test-artifacts/work/
          retention-days: 7
