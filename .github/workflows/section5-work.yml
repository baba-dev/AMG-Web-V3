name: Section 5 cinematic work showcase

on:
  pull_request:
    branches: [main]
    paths:
      - src/components/aiwa-work.tsx
      - src/components/aiwa-work.css
      - src/lib/work/projects.ts
      - src/app/work/**
      - public/media/work/**
      - scripts/work-section-smoke.cjs
      - .github/workflows/section5-work.yml
  push:
    branches:
      - feat/home-section5-selected-campaigns
  workflow_dispatch:

permissions:
  contents: read

jobs:
  section5:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Build Cloudflare Pages static export
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f out/index.html
          test -f out/work.html -o -f out/work/index.html
      - name: Install headless test browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium --only-shell
      - name: Validate desktop/mobile, reverse scroll, archive, no JS
        run: |
          python3 -m http.server 4173 --directory out > /tmp/aiwa-section5-http.log 2>&1 &
          node scripts/work-section-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aiwa-section5-visual-regression
          path: test-artifacts/work/
          retention-days: 7
