ze="15" font-weight="bold"><text x="85" y="541">03 / INFRASTRUCTURE</text></g><path d="M86 550H270l30-20" fill="none" stroke="#182247"/></g><g class="layer l4"><path d="M300 705L600 620 900 705 600 790Z" fill="#182247" opacity=".13" transform="translate(0 12)"/><path d="M300 690L600 605 900 690 600 775Z" fill="url(#plate)" stroke="#182247" stroke-width="2"/><path d="M300 690v14l300 85 300-85v-14M600 775v14" fill="#7389e6" fill-opacity=".5" stroke="#182247" stroke-width="2"/><circle cx="600" cy="690" r="24" fill="#182247"/><circle cx="600" cy="690" r="8" fill="#c3eb6a"/><path d="M400 690h115m170 0h115" stroke="#182247" stroke-width="2" stroke-dasharray="4 6"/><g fill="#182247" font-family="monospace" font-size="15" font-weight="bold"><text x="85" y="701">04 / HARDWARE</text></g><path d="M86 710H270l30-20" fill="none" stroke="#182247"/></g>
