<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Connected engineering</title><desc id="desc">Original schematic of four connected layers: interface, application, infrastructure and physical devices.</desc>
<defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#182247" stroke-opacity=".12"/></pattern><linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4eaff"/><stop offset="1" stop-color="#a1b1ff"/></linearGradient></defs>
<style>.signal{stroke-dasharray:12 400;animation:travel 3s ease-out 2 both}.layer{animation:lift .9s cubic-bezier(.2,.8,.2,1) both}.l2{animation-delay:.15s}.l3{animation-delay:.3s}.l4{animation-delay:.45s}@keyframes travel{from{stroke-dashoffset:412}to{stroke-dashoffset:0}}@keyframes lift{from{opacity:.3;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.signal,.layer{animation:none}}</style>
<rect width="1200" height="900" fill="#8ea5ff"/><rect width="1200" height="900" fill="url(#grid)"/>
<g stroke="#182247" fill="none" opacity=".32"><circle cx="600" cy="445" r="380"/><circle cx="600" cy="445" r="320" stroke-dasharray="3 12"/><path d="M48 445H1152M600 45V855M50 50h30m-15-15v30M1120 850h30m-15-15v30"/></g>
<g fill="none" stroke="#182247" stroke-width="2"><path d="M600 180V750M300 282H160V640H300M900 380H1040V730H900"/><path d="M600 180V750" stroke="#f7f8ff" stroke-width="6" class="signal"/></g>
