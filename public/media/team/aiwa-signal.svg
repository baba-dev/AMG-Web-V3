<text x="65" y="118" font-size="19" font-weight="700" letter-spacing="5">AIWA / THE SIGNAL</text>
<text x="65" y="975" font-size="22" letter-spacing="5">23.5880° N / 58.3829° E</text>
<text x="65" y="1025" font-size="15" letter-spacing="3" opacity=".65">ORIGINAL EDITORIAL ARTWORK / NOT AN OFFICE OR TEAM PHOTO</text>
