<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">Aiwa Signal — editorial abstract</title>
<desc id="desc">Original abstract artwork of concentric signal rings radiating from Muscat-inspired geographic axes. This is graphic design, not documentary photography.</desc>
