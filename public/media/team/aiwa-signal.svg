<radialGradient id="glow"><stop stop-color="#b9b6a4" stop-opacity=".58"/><stop offset="1" stop-color="#b9b6a4" stop-opacity="0"/></radialGradient>
<pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M1 0v1M5 4v1" stroke="#fff" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1600" height="1100" fill="url(#bg)"/>
<circle cx="1170" cy="520" r="620" fill="url(#glow)"/>
<g fill="none" stroke="#e5e4dc" stroke-opacity=".35" stroke-width="1.3">
<circle cx="1170" cy="520" r="170"/><circle cx="1170" cy="520" r="260"/><circle cx="1170" cy="520" r="350"/><circle cx="1170" cy="520" r="440"/><circle cx="1170" cy="520" r="530"/><circle cx="1170" cy="520" r="620"/>
